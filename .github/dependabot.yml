version: 2

# Maintenance policy for AmputatorBot
# ------------------------------------
# - Routine dependency updates: monthly, grouped into one PR per ecosystem per month.
#   Minor + patch bumps land in a single PR per ecosystem; majors stay separate.
# - Security updates: come through automatically, on Dependabot's own cadence (not
#   bound by the `interval` below). Verify "Dependabot security updates" is enabled
#   in Settings → Code security.
# - PR caps keep the inbox quiet; if the limit is hit, older PRs block newer ones.
# - Consistent commit prefix (`chore(deps)`) keeps history easy to skim and easy to
#   filter from changelog-style git logs.

updates:
  # Rust backend
  - package-ecosystem: cargo
    directory: /backend
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      cargo-major:
        patterns: ["*"]
        update-types: [major]

  # pnpm workspace: devvit-app + website.
  # One config at the repo root, NOT one per subdirectory — per-directory npm
  # configs edit only that directory's package.json and can't see the shared
  # root pnpm-lock.yaml, so every merged PR left main failing
  # `pnpm install --frozen-lockfile` (ERR_PNPM_OUTDATED_LOCKFILE; see PRs
  # #36/#38). Rooted at the workspace, dependabot updates member manifests
  # and the lockfile together.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    ignore:
      # @astrojs/check peer-requires typescript ^5 || ^6 — `astro check` (the
      # website) breaks on TS 7. Drop this once @astrojs/check widens its peer
      # range. Root-level scope means it also freezes devvit-app's typescript
      # major (already on 7; next major is far off).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-major:
        patterns: ["*"]
        update-types: [major]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]

  # Dockerfile base images (combined Astro + Rust build at the repo root)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
